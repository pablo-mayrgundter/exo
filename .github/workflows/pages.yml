name: Pages

# Builds the site and deploys it to the root of the gh-pages branch, which
# GitHub Pages serves at the custom domain set in the repo's Pages settings
# (exo.cafe). clean-exclude keeps what this deploy doesn't own: the PR
# previews (.github/workflows/pr-preview.yml), and the CNAME file GitHub
# writes to the branch when the domain is set there.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          clean-exclude: |
            CNAME
            pr-preview
            pr-preview/**
